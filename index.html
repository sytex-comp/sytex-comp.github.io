<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restockr - Track Product Stock in Real-Time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #050505;
            --bg-secondary: #0b0b0d;
            --bg-card: #121215;
            --text-primary: #f5f5f7;
            --text-secondary: #9ea0a5;
            --accent-blue: #0056b3;
            --accent-blue-hover: #1e88e5;
            --border-color: #1e1e24;
            --glow-color: rgba(30, 91, 179, 0.15);
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-primary);
            background-image: radial-gradient(circle at 50% 0%, var(--glow-color) 0%, transparent 60%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-section {
            margin-bottom: 3.5rem;
        }
        .app-name {
            font-size: 3.75rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 30%, #9ea0a5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .tagline {
            font-size: 1.125rem;
            color: var(--text-secondary);
            font-weight: 400;
            max-width: 440px;
            margin: 0 auto;
        }
        .links-section {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
            margin-top: 3.5rem;
            padding-top: 2.5rem;
            border-top: 1px solid var(--border-color);
        }
        .links-section a {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 1.1rem;
            border-radius: 16px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .links-section a:hover {
            border-color: var(--accent-blue-hover);
            background-color: rgba(30, 91, 179, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3), 0 0 15px rgba(30, 91, 179, 0.05);
        }
        .links-section a::after {
            content: '→';
            opacity: 0.5;
            transition: transform 0.2s ease;
        }
        .links-section a:hover::after {
            transform: translateX(3px);
            opacity: 1;
            color: var(--accent-blue-hover);
        }
        .support-text {
            margin-top: 3.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        .support-text a {
            color: var(--accent-blue-hover);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .support-text a:hover {
            color: #60a5fa;
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            .app-name {
                font-size: 2.75rem;
            }
            .tagline {
                font-size: 1rem;
            }
            .links-section {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="logo-section">
            <h1 class="app-name">Restockr</h1>
            <p class="tagline">Real-time stock tracking for your favorite online stores. Get instant alerts and never miss a restock.</p>
        </section>
        <nav class="links-section">
            <a href="privacy-policy.html">Privacy Policy</a>
            <a href="terms-conditions.html">Terms & Conditions</a>
            <a href="refund-policy.html">Refund Policy</a>
            <a href="pricing-page.html">Pricing Plans</a>
        </nav>
        <p class="support-text">For support, contact <a href="mailto:sytex.comp@gmail.com">sytex.comp@gmail.com</a></p>
    </main>
</body>
</html>
