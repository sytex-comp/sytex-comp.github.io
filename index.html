<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restockr</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .logo-section {
            margin-bottom: 3rem;
        }

        .app-name {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
            color: #FFFFFF;
        }

        .tagline {
            font-size: 1.125rem;
            color: #ADB5BD;
            font-weight: 400;
            max-width: 440px;
            margin: 0 auto;
        }

        .links-section {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 4rem;
            padding-top: 2.5rem;
            border-top: 1px solid #333333;
        }

        .links-section a {
            background-color: #2E2E2E;
            border: 1px solid #444444;
            color: #FFFFFF;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 1rem;
            border-radius: 16px;
            transition: background-color 0.2s ease, border-color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .links-section a:hover {
            background-color: #3E3E3E;
            border-color: #0056b3;
        }

        .support-text {
            margin-top: 3rem;
            font-size: 0.875rem;
            color: #6C757D;
        }

        .support-text a {
            color: #0056b3;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .support-text a:hover {
            color: #1E5BB3;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .app-name {
                font-size: 2.75rem;
            }

            .tagline {
                font-size: 1rem;
            }

            .links-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="logo-section">
            <h1 class="app-name">Restockr</h1>
            <p class="tagline">Real-time stock tracking for your favorite online stores. Get instant alerts and never miss a restock.</p>
        </section>

        <nav class="links-section">
            <a href="privacy-policy.html">Privacy Policy</a>
            <a href="terms-conditions.html">Terms & Conditions</a>
            <a href="refund-policy.html">Refund Policy</a>
            <a href="pricing-page.html">Pricing Plans</a>
        </nav>

        <p class="support-text">For support, contact <a href="mailto:sytex.comp@gmail.com">sytex.comp@gmail.com</a></p>
    </main>
</body>
</html>
