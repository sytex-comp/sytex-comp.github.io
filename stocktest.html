<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Product Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f4f4f4;
        }
        .product-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .price {
            font-size: 24px;
            color: #333;
            font-weight: bold;
        }
        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: bold;
        }
        /* Class for when the item is unavailable */
        .out-of-stock {
            background-color: #ffebee;
            color: #c62828;
        }
        /* Class for when the item is available */
        .in-stock {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
    </style>
</head>
<body>

    <div class="product-card">
        <h2>Test Gadget Pro</h2>
        <p class="price">$99.99</p>
        
        <div id="stock-status" class="status out-of-stock">Out of Stock</div>
    </div>

</body>
</html>
