<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dummy Product Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
        }
        .product-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        .status {
            font-weight: bold;
            font-size: 1.2em;
            margin-top: 20px;
        }
        .in-stock { color: green; }
        .out-of-stock { color: red; }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="product-card">
        <h1>Awesome Widget</h1>
        <p>This is a test product for Restockr.</p>
        
        <!-- The stock status text that Restockr will scrape -->
        <div id="stock-status" class="status">Loading...</div>
        
        <button id="toggle-btn" onclick="toggleStock()">Simulate Stock Change</button>
    </div>

    <script>
        // Check the URL for ?status=soldout or ?status=instock
        const urlParams = new URLSearchParams(window.location.search);
        let currentStatus = urlParams.get('status') || 'soldout'; // Default to sold out

        function updateUI() {
            const statusEl = document.getElementById('stock-status');
            if (currentStatus === 'instock') {
                statusEl.textContent = 'In Stock';
                statusEl.className = 'status in-stock';
            } else {
                statusEl.textContent = 'Sold Out';
                statusEl.className = 'status out-of-stock';
            }
        }

        function toggleStock() {
            currentStatus = currentStatus === 'instock' ? 'soldout' : 'instock';
            
            // Update the URL without reloading the page, so you can copy it
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?status=' + currentStatus;
            window.history.pushState({path:newUrl},'',newUrl);
            
            updateUI();
        }

        // Initial render
        updateUI();
    </script>

</body>
</html>
