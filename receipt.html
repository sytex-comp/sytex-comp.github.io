<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt</title>
    <link rel="stylesheet" href="styles.css?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap"
        rel="stylesheet">
    <style>
        .receipt-status {
            color: #8892A9;
            font-family: "JetBrains Mono", monospace;
            font-size: 12px;
            left: 50%;
            line-height: 1.5;
            max-width: 420px;
            position: absolute;
            text-align: center;
            top: 16px;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            z-index: 10;
        }

        .receipt-status[data-state="error"] {
            color: #d98989;
        }
    </style>
</head>

<body class="receipt-page">
    <div id="receipt-status" class="receipt-status">Loading receipt...</div>
    <main id="receipt-root"></main>

    <script src="receipt-api.js?v=3"></script>
    <script>
        var DEFAULT_API_URL = "https://restockr-543543806944.europe-west1.run.app";

        function params() {
            return new URLSearchParams(window.location.search);
        }

        function endpointCandidates(apiUrl, orderId, explicitEndpoint) {
            var base = apiUrl.replace(/\/+$/, "");
            var encoded = encodeURIComponent(orderId);
            var explicit = explicitEndpoint ? new URL(explicitEndpoint, base + "/").toString() : "";
            var urls = [
                explicit,
                base + "/receipt?orderId=" + encoded,
                base + "/api/receipt?orderId=" + encoded,
                base + "/paddle/receipt?orderId=" + encoded,
                base + "/transaction/" + encoded,
                base + "/transactions/" + encoded,
                base + "/api/transaction/" + encoded,
                base + "/api/transactions/" + encoded
            ];

            return urls.filter(function (url, index) {
                return url && urls.indexOf(url) === index;
            });
        }

        async function fetchJson(urls) {
            var index;
            var response;
            var errors = [];

            for (index = 0; index < urls.length; index += 1) {
                try {
                    response = await fetch(urls[index], {
                        headers: {
                            "Accept": "application/json"
                        }
                    });

                    if (response.ok) {
                        return await response.json();
                    }

                    errors.push(urls[index] + " returned " + response.status);
                } catch (error) {
                    errors.push(urls[index] + " failed");
                }
            }

            throw new Error(errors.join("; "));
        }

        function storedReceipt(orderId) {
            var raw;

            try {
                raw = sessionStorage.getItem("notBoringReceipt:" + orderId);
                return raw ? JSON.parse(raw) : null;
            } catch (error) {
                return null;
            }
        }

        function setStatus(message, state) {
            var element = document.getElementById("receipt-status");

            element.textContent = message;
            element.dataset.state = state || "";
        }

        async function loadReceipt() {
            var search = params();
            var orderId = search.get("orderId") || search.get("transactionId");
            var apiUrl = search.get("apiUrl") || DEFAULT_API_URL;
            var receipt = NotBoringReceipt.mount({
                target: "#receipt-root",
                data: {
                    orderId: orderId || "--"
                }
            });
            var payload;

            if (!orderId) {
                setStatus("Missing order ID in receipt URL.", "error");
                return;
            }

            payload = storedReceipt(orderId);

            if (!payload) {
                try {
                    payload = await fetchJson(endpointCandidates(apiUrl, orderId, search.get("receiptEndpoint")));
                } catch (error) {
                    console.error(error);
                    setStatus("Receipt data is not available yet. Showing the order ID from checkout.", "error");
                    return;
                }
            }

            receipt.update(NotBoringReceipt.fromProviderPayload(payload, {
                orderId: orderId
            }));
            setStatus("");
        }

        loadReceipt();
    </script>
</body>

</html>
